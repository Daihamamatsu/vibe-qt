services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # SQLite データの共有ホスト。
  # backend と同一の DB ファイル（./backend/db/stock.db）を /data/db として共有し、
  # クエリ確認用に常駐させる（nouchka/sqlite3 は CLI イメージのため、
  # データアクセス用途として存続プロセスを明示している）。
  # 例: docker compose exec db sqlite3 /data/db/stock.db ".tables"
  db:
    image: nouchka/sqlite3
    volumes:
      - ./backend/db:/data/db
    entrypoint: ["sh", "-c"]
    command: ["tail -f /dev/null"]